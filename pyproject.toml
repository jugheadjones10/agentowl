[project]
name = "agentowl"
version = "0.1.0"
description = "Fork of PoE-World: compositional world modeling with products of programmatic experts"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "antlr4-python3-runtime==4.9.3",
    "bitarray==2.9.2",
    "bitstring==4.2.3",
    "contourpy==1.2.1",
    "cycler==0.12.1",
    "dill==0.3.8",
    "fonttools==4.53.0",
    "gdown==5.2.0",
    "hydra-core==1.3.2",
    "juliacall==0.9.20",
    "juliapkg==0.1.13",
    "kiwisolver==1.4.5",
    "matplotlib==3.9.0",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "optimparallel==0.1.3",
    "packaging==24.1",
    "pillow==10.3.0",
    "pyparsing==3.1.2",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.1",
    "scipy==1.14.0",
    "semver==3.0.2",
    "six==1.16.0",
    "z3-solver==4.13.0.0",
    "torch",
    "colorlog==6.9.0",
    "gymnasium[atari]",
    "openai-hf-interface",
    "ocatari",
    "marimo>=0.23.4",
]

[dependency-groups]
dev = [
    "coverage==7.5.3",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
openai-hf-interface = { path = "openai-hf-interface", editable = true }
ocatari = { path = "OC_Atari", editable = true }

[tool.ruff]
target-version = "py310"
line-length = 79
extend-exclude = [
    "CausalDiscovery.jl",
    "OC_Atari",
    "openai-hf-interface",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Let the formatter manage wrapping where it can.
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
